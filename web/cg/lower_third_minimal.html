<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Lower Third - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
        }

        .lower-third {
            position: absolute;
            bottom: 140px;
            left: 0;
            right: 0;
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .line {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #ffffff 10%, #ffffff 90%, transparent 100%);
            margin-bottom: 20px;
            opacity: 0;
            animation: lineExpand 0.8s ease-out 0.3s forwards;
        }

        @keyframes lineExpand {
            from {
                transform: scaleX(0);
                opacity: 0;
            }

            to {
                transform: scaleX(1);
                opacity: 0.6;
            }
        }

        .content {
            text-align: center;
            padding: 0 200px;
        }

        .name {
            font-size: 52px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-size: 26px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body>
    <div class="lower-third" id="lowerThird">
        <div class="line"></div>
        <div class="content">
            <div class="name" id="nameText">Sarah Williams</div>
            <div class="title" id="titleText">Chief Editor</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || 'Sarah Williams';
        const title = params.get('title') || 'Chief Editor';

        document.getElementById('nameText').textContent = name;
        document.getElementById('titleText').textContent = title;
    </script>
</body>

</html>
