<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Industry Themed Graphics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', sans-serif;
        }

        .industry-banner {
            position: absolute;
            bottom: 100px;
            left: 60px;
            width: 800px;
            opacity: 0;
            animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .industry-bar {
            position: relative;
            padding: 24px 32px;
            border-radius: 4px;
            overflow: hidden;
        }

        .industry-bar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .industry-content {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .industry-icon {
            font-size: 48px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .industry-text {
            flex: 1;
        }

        .industry-title {
            font-size: 42px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 4px;
            line-height: 1;
        }

        .industry-subtitle {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* ===== AUTO/MOTORSPORTS ===== */
        .industry-bar.auto {
            background: linear-gradient(135deg, #D32F2F 0%, #1A0000 100%);
            border-left: 8px solid #FFD700;
        }

        .industry-bar.auto .industry-title,
        .industry-bar.auto .industry-subtitle {
            color: #FFFFFF;
        }

        /* ===== MANUFACTURING ===== */
        .industry-bar.manufacturing {
            background: linear-gradient(135deg, #424242 0%, #1A1A1A 100%);
            border-left: 8px solid #64B5F6;
        }

        .industry-bar.manufacturing .industry-title,
        .industry-bar.manufacturing .industry-subtitle {
            color: #E0E0E0;
        }

        /* ===== TECHNOLOGY ===== */
        .industry-bar.tech {
            background: linear-gradient(135deg, #1A237E 0%, #0D47A1 100%);
            border-left: 8px solid #00D9FF;
        }

        .industry-bar.tech .industry-title,
        .industry-bar.tech .industry-subtitle {
            color: #E0F7FF;
        }

        /* ===== AGRICULTURE ===== */
        .industry-bar.agriculture {
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%);
            border-left: 8px solid #FFB81C;
        }

        .industry-bar.agriculture .industry-title,
        .industry-bar.agriculture .industry-subtitle {
            color: #FFFFFF;
        }

        /* Bar chart accent */
        .chart-accent {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .chart-bar {
            width: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            animation: grow 0.8s ease-out forwards;
        }

        @keyframes grow {
            from { height: 0; }
            to { height: var(--height); }
        }

        .chart-bar:nth-child(1) { --height: 30px; animation-delay: 0.2s; }
        .chart-bar:nth-child(2) { --height: 45px; animation-delay: 0.35s; }
        .chart-bar:nth-child(3) { --height: 35px; animation-delay: 0.5s; }
    </style>
</head>

<body>
    <div class="industry-banner" id="banner">
        <div class="industry-bar" id="bar">
            <div class="industry-content">
                <div class="industry-icon" id="icon">🏎️</div>
                <div class="industry-text">
                    <div class="industry-title" id="title">Motorsports</div>
                    <div class="industry-subtitle" id="subtitle">Special Coverage</div>
                </div>
            </div>
            <div class="chart-accent">
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
                <div class="chart-bar"></div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const industry = params.get('industry') || 'auto';

        const industries = {
            auto: {
                class: 'auto',
                icon: '🏎️',
                title: 'MOTORSPORTS',
                subtitle: 'Live Coverage'
            },
            manufacturing: {
                class: 'manufacturing',
                icon: '🏭',
                title: 'MANUFACTURING',
                subtitle: 'Industry Report'
            },
            tech: {
                class: 'tech',
                icon: '💻',
                title: 'TECHNOLOGY',
                subtitle: 'Tech Innovations'
            },
            agriculture: {
                class: 'agriculture',
                icon: '🌾',
                title: 'AGRICULTURE',
                subtitle: 'Farm Report'
            }
        };

        const config = industries[industry] || industries.auto;
        const bar = document.getElementById('bar');
        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        bar.className = `industry-bar ${config.class}`;
        icon.textContent = config.icon;
        title.textContent = config.title;
        subtitle.textContent = config.subtitle;
    </script>
</body>

</html>
