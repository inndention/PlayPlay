<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Seasonal & Holiday Graphics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', sans-serif;
        }

        .holiday-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            animation: slideDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -80%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .holiday-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        /* ===== CHRISTMAS ===== */
        .holiday-bg.christmas {
            background: linear-gradient(135deg, #0A3A1A 0%, #1A5C2A 50%, #2D8C3C 100%);
        }

        .snowflake {
            position: absolute;
            color: #FFFFFF;
            opacity: 0.8;
            animation: fall 8s ease-in infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(1080px) translateX(var(--offset));
                opacity: 0;
            }
        }

        .christmas-title {
            font-size: 88px;
            font-weight: 900;
            background: linear-gradient(45deg, #FF0000, #00CC00, #FF0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .christmas-subtitle {
            font-size: 36px;
            color: #FFD700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* ===== HALLOWEEN ===== */
        .holiday-bg.halloween {
            background: linear-gradient(135deg, #1A0A2E 0%, #3A1A4E 50%, #5A2A6E 100%);
        }

        .halloween-title {
            font-size: 88px;
            font-weight: 900;
            color: #FF6600;
            text-shadow: 3px 3px 0 #000000, 6px 6px 20px rgba(255, 102, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .halloween-subtitle {
            font-size: 36px;
            color: #00FF00;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        /* ===== NEW YEAR ===== */
        .holiday-bg.newyear {
            background: linear-gradient(135deg, #001A4D 0%, #003D99 50%, #0055CC 100%);
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            opacity: 0.9;
            animation: confettiFall 4s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(1080px) translateX(var(--offset)) rotate(360deg);
                opacity: 0;
            }
        }

        .newyear-title {
            font-size: 88px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .newyear-subtitle {
            font-size: 36px;
            color: #00D9FF;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
        }

        /* ===== THANKSGIVING ===== */
        .holiday-bg.thanksgiving {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #CD853F 100%);
        }

        .thanksgiving-title {
            font-size: 88px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 2px 2px 0 #8B4513, 4px 4px 15px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .thanksgiving-subtitle {
            font-size: 36px;
            color: #FFD700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* ===== SUMMER ===== */
        .holiday-bg.summer {
            background: linear-gradient(135deg, #FFB81C 0%, #FF6B00 50%, #FF8C00 100%);
        }

        .summer-title {
            font-size: 88px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 2px 2px 0 #0066FF, 4px 4px 15px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .summer-subtitle {
            font-size: 36px;
            color: #0066FF;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* ===== SPRING ===== */
        .holiday-bg.spring {
            background: linear-gradient(135deg, #FFC0CB 0%, #FFB6D9 50%, #FFA6C0 100%);
        }

        .spring-title {
            font-size: 88px;
            font-weight: 900;
            color: #00A080;
            text-shadow: 2px 2px 0 #FFFFFF, 4px 4px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .spring-subtitle {
            font-size: 36px;
            color: #0055CC;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="holiday-bg" id="bg"></div>

    <div class="holiday-banner" id="banner">
        <div id="title" class="christmas-title">MERRY CHRISTMAS</div>
        <div id="subtitle" class="christmas-subtitle">Special Coverage</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const holiday = params.get('holiday') || 'christmas';
        const bg = document.getElementById('bg');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        const holidays = {
            christmas: {
                bg: 'christmas',
                titleClass: 'christmas-title',
                title: 'MERRY CHRISTMAS',
                subtitle: 'Special Coverage'
            },
            halloween: {
                bg: 'halloween',
                titleClass: 'halloween-title',
                title: '🎃 HALLOWEEN 🎃',
                subtitle: 'Special Coverage'
            },
            newyear: {
                bg: 'newyear',
                titleClass: 'newyear-title',
                title: 'HAPPY NEW YEAR',
                subtitle: 'Special Coverage'
            },
            thanksgiving: {
                bg: 'thanksgiving',
                titleClass: 'thanksgiving-title',
                title: 'THANKSGIVING',
                subtitle: 'Special Coverage'
            },
            summer: {
                bg: 'summer',
                titleClass: 'summer-title',
                title: 'SUMMER SPECIAL',
                subtitle: 'Extended Coverage'
            },
            spring: {
                bg: 'spring',
                titleClass: 'spring-title',
                title: 'SPRING EDITION',
                subtitle: 'Extended Coverage'
            }
        };

        const config = holidays[holiday] || holidays.christmas;
        bg.className = `holiday-bg ${config.bg}`;
        title.className = config.titleClass;
        title.textContent = config.title;
        subtitle.textContent = config.subtitle;

        // Generate seasonal effects
        if (holiday === 'christmas') {
            for (let i = 0; i < 40; i++) {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.textContent = '❄';
                snow.style.left = Math.random() * 100 + '%';
                snow.style.top = -50 + 'px';
                snow.style.fontSize = (Math.random() * 20 + 20) + 'px';
                snow.style.setProperty('--offset', (Math.random() * 200 - 100) + 'px');
                snow.style.animationDuration = (Math.random() * 6 + 8) + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(snow);
            }
        }

        if (holiday === 'newyear') {
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = ['#FFD700', '#00D9FF', '#A855F7', '#FF6B6B'][Math.floor(Math.random() * 4)];
                confetti.style.setProperty('--offset', (Math.random() * 400 - 200) + 'px');
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>

</html>
