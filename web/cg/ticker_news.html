<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>News Ticker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        .ticker-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(90deg, rgba(220, 38, 38, 0.95) 0%, rgba(153, 27, 27, 0.95) 100%);
            border-top: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-label {
            background: rgba(0, 0, 0, 0.6);
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex-shrink: 0;
            border-right: 3px solid rgba(255, 255, 255, 0.3);
        }

        .ticker-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
        }

        .ticker-text {
            position: absolute;
            white-space: nowrap;
            font-size: 24px;
            font-weight: 500;
            color: white;
            padding: 0 40px;
            line-height: 60px;
            animation: scroll linear infinite;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>
    <div class="ticker-container">
        <div class="ticker-label">
            <span id="labelText">NEWS</span>
        </div>
        <div class="ticker-content">
            <div class="ticker-text" id="tickerText">Breaking news story • Another update • More information coming...
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text') || 'Breaking news story • Another update • More information coming...';
        const speed = parseInt(params.get('speed') || '100'); // pixels per second
        const label = params.get('label') || 'NEWS';

        document.getElementById('tickerText').textContent = text;
        document.getElementById('labelText').textContent = label.toUpperCase();

        // Calculate animation duration based on text length and speed
        const ticker = document.getElementById('tickerText');
        const textWidth = ticker.offsetWidth;
        const duration = (textWidth + 1920) / speed;

        ticker.style.animationDuration = `${duration}s`;
    </script>
</body>

</html>
