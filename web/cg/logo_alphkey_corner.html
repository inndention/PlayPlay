<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Logo with Alphkey</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
        }

        .logo-container {
            position: absolute;
            top: 54px;
            right: 96px;
            width: 320px;
            height: 320px;
            opacity: 0;
            animation: zoomIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .logo-frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #00D9FF;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 217, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .logo-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .logo-image {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #00D9FF 0%, #A855F7 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        /* Corner accent dots */
        .corner-accent {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0;
        }

        .corner-accent.tl { top: -4px; left: -4px; animation: fadeInScale 0.4s 0.3s forwards; }
        .corner-accent.tr { top: -4px; right: -4px; animation: fadeInScale 0.4s 0.4s forwards; }
        .corner-accent.bl { bottom: -4px; left: -4px; animation: fadeInScale 0.4s 0.5s forwards; }
        .corner-accent.br { bottom: -4px; right: -4px; animation: fadeInScale 0.4s 0.6s forwards; }

        @keyframes fadeInScale {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Glow effect */
        .logo-frame::after {
            content: '';
            position: absolute;
            inset: -3px;
            border: 2px solid #00D9FF;
            border-radius: 8px;
            opacity: 0.4;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
    </style>
</head>

<body>
    <div class="logo-container" id="logoContainer">
        <div class="logo-frame">
            <div class="logo-image" id="logoImg">YOUR LOGO</div>
            <div class="corner-accent tl"></div>
            <div class="corner-accent tr"></div>
            <div class="corner-accent bl"></div>
            <div class="corner-accent br"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const logoSrc = params.get('logo');
        if (logoSrc) {
            document.getElementById('logoImg').innerHTML = `<img src="${logoSrc}" style="width:100%;height:100%;object-fit:contain;">`;
        }
    </script>
</body>

</html>
