<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Title Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            font-family: 'Montserrat', 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 217, 255, 0.1) 100%);
            animation: radialPulse 5s infinite;
        }

        @keyframes radialPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .title-container {
            text-align: center;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .title {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #00D9FF 0%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 30px;
            text-shadow: 0 0 60px rgba(0, 217, 255, 0.5);
            animation: titleGlow 3s infinite;
        }

        @keyframes titleGlow {

            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
            }

            50% {
                filter: drop-shadow(0 0 40px rgba(0, 217, 255, 0.8));
            }
        }

        .subtitle {
            font-size: 48px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 4px;
            animation: subtitleSlide 1s 0.3s ease-out forwards;
            opacity: 0;
        }

        @keyframes subtitleSlide {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="title-container">
        <div class="title" id="titleText">Show Title</div>
        <div class="subtitle" id="subtitleText">Episode Name</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'Show Title';
        const subtitle = params.get('subtitle') || 'Episode Name';

        document.getElementById('titleText').textContent = title.toUpperCase();
        document.getElementById('subtitleText').textContent = subtitle;
    </script>
</body>

</html>
