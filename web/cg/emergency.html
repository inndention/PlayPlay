<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Emergency Alert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 60px;
        }

        .alert-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95) 0%, rgba(220, 38, 38, 0.95) 100%);
            backdrop-filter: blur(10px);
            padding: 24px 60px;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.6),
                0 0 60px rgba(239, 68, 68, 0.4);
            animation: pulseGlow 2s infinite, slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-200px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 8px 32px rgba(239, 68, 68, 0.6),
                    0 0 60px rgba(239, 68, 68, 0.4);
            }

            50% {
                box-shadow: 0 8px 48px rgba(239, 68, 68, 0.8),
                    0 0 100px rgba(239, 68, 68, 0.6);
            }
        }

        .alert-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
            animation: sweep 3s infinite;
        }

        @keyframes sweep {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .alert-content {
            display: flex;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .icon {
            font-size: 48px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .alert-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .alert-label {
            font-size: 24px;
            font-weight: 800;
            color: white;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .alert-message {
            font-size: 36px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <div class="alert-banner">
        <div class="alert-content">
            <div class="icon">⚠️</div>
            <div class="alert-text">
                <div class="alert-label">EMERGENCY ALERT</div>
                <div class="alert-message" id="alertMessage">This is a test of the emergency broadcast system</div>
            </div>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const message = params.get('message') || 'This is a test of the emergency broadcast system';

        document.getElementById('alertMessage').textContent = message;
    </script>
</body>

</html>
