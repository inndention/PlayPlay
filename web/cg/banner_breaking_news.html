<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Breaking News Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        .banner-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            box-shadow: 0 4px 24px rgba(220, 38, 38, 0.6);
            display: flex;
            align-items: center;
            animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: translateY(-100%);
        }

        @keyframes slideDown {
            to {
                transform: translateY(0);
            }
        }

        .banner-label {
            padding: 0 40px;
            background: rgba(0, 0, 0, 0.4);
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .banner-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: sweep 2s infinite;
        }

        @keyframes sweep {

            0%,
            100% {
                left: -100%;
            }

            50% {
                left: 100%;
            }
        }

        .banner-content {
            flex: 1;
            padding: 0 40px;
            font-size: 30px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            white-space: nowrap;
        }

        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>
    <div class="banner-container">
        <div class="banner-label">
            <span>BREAKING</span>
        </div>
        <div class="banner-content">
            <div class="scrolling-text" id="bannerText">Major story developing</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text') || 'Major story developing';

        document.getElementById('bannerText').textContent = text;
    </script>
</body>

</html>
