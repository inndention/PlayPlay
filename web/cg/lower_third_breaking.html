<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Breaking News Lower Third</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        .breaking-container {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            display: flex;
            gap: 0;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
            }
        }

        .breaking-label {
            background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            }

            50% {
                box-shadow: 0 0 0 20px rgba(220, 38, 38, 0);
            }
        }

        .breaking-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: flash 2s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                left: -100%;
            }

            50% {
                left: 100%;
            }
        }

        .breaking-text {
            font-size: 36px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .headline-container {
            flex: 1;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.95) 0%, rgba(20, 20, 25, 0.9) 100%);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            border-left: 4px solid #DC2626;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .headline {
            font-size: 32px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .details-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 40px;
            border-top: 2px solid rgba(220, 38, 38, 0.5);
        }

        .details {
            font-size: 22px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>

<body>
    <div class="breaking-container">
        <div class="breaking-label">
            <div class="breaking-text" id="labelText">BREAKING</div>
        </div>
        <div class="headline-container">
            <div class="headline" id="headlineText">Major story developing...</div>
        </div>
    </div>
    <div class="details-container" style="position: absolute; bottom: 0; left: 0; right: 0; display: none;"
        id="detailsContainer">
        <div class="details" id="detailsText"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const headline = params.get('headline') || 'Major story developing...';
        const details = params.get('details') || '';
        const label = params.get('label') || 'BREAKING';

        document.getElementById('labelText').textContent = label.toUpperCase();
        document.getElementById('headlineText').textContent = headline;

        if (details) {
            document.getElementById('detailsText').textContent = details;
            document.getElementById('detailsContainer').style.display = 'block';
        }
    </script>
</body>

</html>
