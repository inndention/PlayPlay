<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Sports Lower Third</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Roboto', 'Arial Black', sans-serif;
        }

        .lower-third {
            position: absolute;
            bottom: 100px;
            left: -700px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes slideIn {
            to {
                left: 50px;
            }
        }

        .stripe {
            width: 8px;
            height: 120px;
            background: var(--team-color, #FF0000);
            box-shadow: 0 0 20px var(--team-color, #FF0000);
            animation: glow 2s infinite;
        }

        @keyframes glow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .content {
            background: linear-gradient(135deg, rgba(20, 20, 25, 0.95), rgba(30, 30, 40, 0.95));
            padding: 20px 30px;
            border-radius: 0 12px 12px 0;
            border-left: 4px solid var(--team-color, #FF0000);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {

            0%,
            100% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(100%);
            }
        }

        .name {
            font-size: 48px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8),
                0 0 20px var(--team-color, #FF0000);
            position: relative;
            z-index: 1;
            margin-bottom: 8px;
        }

        .position {
            font-size: 28px;
            font-weight: 700;
            color: var(--team-color, #FF0000);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="lower-third" id="lowerThird">
        <div class="stripe"></div>
        <div class="content">
            <div class="name" id="nameText">PLAYER NAME</div>
            <div class="position" id="positionText">FORWARD</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || 'PLAYER NAME';
        const position = params.get('position') || 'FORWARD';
        const teamColor = params.get('teamColor') || '#FF0000';

        document.documentElement.style.setProperty('--team-color', teamColor);
        document.getElementById('nameText').textContent = name.toUpperCase();
        document.getElementById('positionText').textContent = position.toUpperCase();
    </script>
</body>

</html>
