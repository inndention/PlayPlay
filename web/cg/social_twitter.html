<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Twitter/X Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .tweet-container {
            position: absolute;
            bottom: 150px;
            right: 80px;
            width: 600px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: translateX(100%);
        }

        @keyframes slideIn {
            to {
                transform: translateX(0);
            }
        }

        .tweet-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1DA1F2, #0d8bd9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
        }

        .display-name {
            font-size: 20px;
            font-weight: 700;
            color: #0f1419;
            margin-bottom: 2px;
        }

        .username {
            font-size: 16px;
            color: #536471;
        }

        .x-logo {
            width: 32px;
            height: 32px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .tweet-content {
            font-size: 22px;
            line-height: 1.5;
            color: #0f1419;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="tweet-container">
        <div class="tweet-header">
            <div class="avatar" id="avatar">
                <span id="avatarLetter">U</span>
            </div>
            <div class="user-info">
                <div class="display-name" id="displayName">User Name</div>
                <div class="username" id="username">@username</div>
            </div>
            <div class="x-logo">𝕏</div>
        </div>
        <div class="tweet-content" id="tweetContent">This is a sample tweet</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username') || '@username';
        const displayName = params.get('displayName') || 'User Name';
        const tweet = params.get('tweet') || 'This is a sample tweet';
        const avatar = params.get('avatar') || '';

        document.getElementById('username').textContent = username;
        document.getElementById('displayName').textContent = displayName;
        document.getElementById('tweetContent').textContent = tweet;

        if (avatar) {
            document.getElementById('avatar').innerHTML = `<img src="${avatar}" alt="Avatar">`;
        } else {
            document.getElementById('avatarLetter').textContent = displayName.charAt(0).toUpperCase();
        }
    </script>
</body>

</html>
