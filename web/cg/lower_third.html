<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Lower Third</title>
    <style>
        :root {
            --theme-color-1: #00d9ff;
            --theme-color-2: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .lower-third {
            position: absolute;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Removed opacity: 0 and animation */
        }

        /* Positioning Classes - Just position, no animation */
        .pos-left {
            left: 60px;
            align-items: flex-start;
        }

        .pos-center {
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            text-align: center;
        }

        .pos-right {
            right: 60px;
            align-items: flex-end;
            text-align: right;
        }

        .name-container {
            background: linear-gradient(135deg, var(--theme-color-1) 0%, var(--theme-color-2) 100%);
            padding: 16px 32px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .name-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.2) 50%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {

            0%,
            100% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(100%);
            }
        }

        .name {
            font-size: 42px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .title-container {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 32px;
            border-radius: 6px;
            border-left: 4px solid var(--theme-color-1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .pos-right .title-container {
            border-left: none;
            border-right: 4px solid var(--theme-color-1);
        }

        .title {
            font-size: 28px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.5px;
        }

        .logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: none;
            z-index: 2;
        }

        .logo.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="lower-third" id="lowerThird">
        <div class="name-container">
            <img id="logoImg" class="logo" src="" alt="Logo">
            <div class="name" id="nameText">John Doe</div>
        </div>
        <div class="title-container">
            <div class="title" id="titleText">Reporter</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || 'John Doe';
        const title = params.get('title') || 'Reporter';
        const position = params.get('position') || 'left';
        const logoUrl = params.get('logo');
        const color1 = params.get('color1');
        const color2 = params.get('color2');

        // Apply Text
        document.getElementById('nameText').textContent = name;
        document.getElementById('titleText').textContent = title;

        // Apply Position
        const lowerThird = document.getElementById('lowerThird');
        lowerThird.classList.remove('pos-left', 'pos-center', 'pos-right');
        lowerThird.classList.add(`pos-${position}`);

        // Apply Logo
        if (logoUrl) {
            const logoImg = document.getElementById('logoImg');
            logoImg.src = logoUrl;
            logoImg.classList.add('visible');
        }

        // Apply Colors
        const root = document.documentElement;
        if (color1) root.style.setProperty('--theme-color-1', '#' + color1.replace('#', ''));
        if (color2) root.style.setProperty('--theme-color-2', '#' + color2.replace('#', ''));
    </script>
</body>

</html>
