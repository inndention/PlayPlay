<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Fullscreen Graphics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.95) 0%, rgba(20, 20, 25, 0.95) 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .scoreboard {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(20px);
            padding: 60px 80px;
            border-radius: 24px;
            border: 2px solid rgba(0, 217, 255, 0.3);
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(0, 217, 255, 0.2);
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .teams {
            display: flex;
            gap: 80px;
            align-items: center;
        }

        .team {
            text-align: center;
        }

        .team-name {
            font-size: 42px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
        }

        .score {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d9ff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .vs {
            font-size: 48px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
        }

        .stats {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            text-align: center;
            padding: 16px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #00d9ff;
        }

        .stat-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="scoreboard">
        <div class="header">
            <div class="title" id="title">MATCH SCOREBOARD</div>
            <div class="subtitle" id="subtitle">Live Score</div>
        </div>

        <div class="teams">
            <div class="team">
                <div class="team-name" id="team1Name">Team Alpha</div>
                <div class="score" id="score1">3</div>
            </div>

            <div class="vs">VS</div>

            <div class="team">
                <div class="team-name" id="team2Name">Team Bravo</div>
                <div class="score" id="score2">2</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="stat1">45:30</div>
                <div class="stat-label">TIME</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat2">Round 2</div>
                <div class="stat-label">ROUND</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat3">Live</div>
                <div class="stat-label">STATUS</div>
            </div>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);

        // Update from parameters
        if (params.get('title')) {
            document.getElementById('title').textContent = params.get('title');
        }
        if (params.get('team1')) {
            document.getElementById('team1Name').textContent = params.get('team1');
        }
        if (params.get('team2')) {
            document.getElementById('team2Name').textContent = params.get('team2');
        }
        if (params.get('score1')) {
            document.getElementById('score1').textContent = params.get('score1');
        }
        if (params.get('score2')) {
            document.getElementById('score2').textContent = params.get('score2');
        }
    </script>
</body>

</html>
